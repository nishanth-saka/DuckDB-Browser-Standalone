<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Duckly - LOCAL</title>
    <style>
      body {
        font-family: sans-serif;
        display: flex;
        padding: 1rem;
        gap: 2rem;
      }
      #leftPanel {
        width: 300px;
        flex-shrink: 0;
        border-right: 1px solid #ddd;
        padding-right: 1rem;
        overflow-y: auto;
      }
      #mainPanel {
        flex: 1;
      }
      #searchSchemaInput {
        padding: 0.4rem;
        font-size: 0.9rem;
        border: 1px solid #ccc;
        border-radius: 4px;
      }

      #searchResultsList {
        list-style: none;
        padding-left: 0;
        font-size: 0.85rem;
        color: #333;
      }

      #editor {
        height: 150px;
        border: 1px solid #ccc;
        margin-bottom: 0.5rem;
      }
      #notesEditor {
        height: 450px;
        border: 1px solid #ccc;
        margin-bottom: 0.5rem;
      }
      .table-scroll {
        overflow-x: auto;
        margin-top: 1rem;
      }
      .tabulator-paginator,
      .tabulator-footer .tabulator-page-size {
        justify-content: flex-start !important;
        float: none !important;
        text-align: left !important;
      }

      .tabulator-footer {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-start !important;
        gap: 1rem;
        align-items: center;
      }

      .tabulator-page-size label,
      .tabulator-page-size select {
        margin-right: 10px;
      }
      .tabulator .tabulator-footer .tabulator-paginator {
        float: none !important;
      }
      table {
        width: max-content;
        border-collapse: collapse;
      }
      th,
      td {
        border: 1px solid #ccc;
        padding: 0.5rem;
        text-align: left;
        white-space: nowrap;
      }
      thead th {
        position: sticky;
        top: 0;
        background: #f3f3f3;
        z-index: 1;
      }
      .table-item {
        cursor: pointer;
        margin-bottom: 0.3rem;
      }
      .table-item:hover {
        text-decoration: underline;
        color: blue;
      }
      .schema-details {
        font-size: 0.9em;
        margin-left: 1rem;
        color: #555;
        display: none;
      }
      button {
        padding: 0.3rem 0.6rem;
        margin: 0.2rem 0;
      }
    </style>
    <!-- Tabulator CSS -->
    <link
      href="https://unpkg.com/tabulator-tables@5.5.2/dist/css/tabulator.min.css"
      rel="stylesheet"
    />

    <!-- Tabulator JS -->
    <script src="https://unpkg.com/tabulator-tables@5.5.2/dist/js/tabulator.min.js"></script>
  </head>
  <body>
    <div id="leftPanel">
      <h3>Schema Explorer</h3>
      <ul id="tablesList">
        No tables loaded.
      </ul>
      <input
        type="text"
        id="searchSchemaInput"
        placeholder="Search tables/columns..."
        style="width: 100%; margin-bottom: 0.5rem"
      />
      <ul
        id="searchResultsList"
        style="max-height: 200px; overflow-y: auto"
      ></ul>
    </div>

    <div id="mainPanel">
      <h2>Duckly Local</h2>
      <input type="file" id="csvInput" accept=".csv" multiple />
      <p><strong>Query:</strong></p>
      <div id="editor"></div>
      <button id="runBtn">Run Query</button>
      <div id="output">No data yet.</div>
      <div id="tabulatorOutput" style="margin-top: 1rem"></div>
      <div style="margin-top: 10px">
        <button onclick="exportCSV()">Export CSV</button>
      </div>
      <h3 style="margin-top: 2rem">Notes</h3>
      <div id="notesEditor"></div>
      <button id="clearNotesBtn">Clear Notes</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
    <script type="module">
      import * as duckdbduckdbWasm from "https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@1.28.1-dev106.0/+esm";
      window.duckdbduckdbWasm = duckdbduckdbWasm;
      let tabulator = null;
      const csvInput = document.getElementById("csvInput");
      const runBtn = document.getElementById("runBtn");
      const output = document.getElementById("output");
      const tablesList = document.getElementById("tablesList");
      let editor, notesEditor, conn;
      let currentSchema = { tables: {}, keywords: [] };

      const searchInput = document.getElementById("searchSchemaInput");
      const searchResultsList = document.getElementById("searchResultsList");

      searchInput.addEventListener("input", () => {
        const query = searchInput.value.toLowerCase();
        searchResultsList.innerHTML = "";

        if (!query) return;

        for (const [table, cols] of Object.entries(currentSchema.tables)) {
          cols.forEach((col) => {
            if (col.toLowerCase().includes(query)) {
              const item = createSearchResultItem(`${table}.${col}`, "Column");
              searchResultsList.appendChild(item);
            }
          });
        }
      });

      function createSearchResultItem(label, type) {
        const li = document.createElement("li");
        li.textContent = `${label} (${type})`;
        li.className = "table-item";
        li.title = "Click to copy";

        li.addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(label);
            li.style.color = "green";
            li.textContent = `Copied: ${label}`;
            setTimeout(() => {
              li.style.color = "";
              li.textContent = `${label}`;
            }, 1200);
          } catch (err) {
            console.error("Copy failed", err);
          }
        });

        return li;
      }

      const keywords = [
        "SELECT",
        "FROM",
        "WHERE",
        "GROUP BY",
        "ORDER BY",
        "INSERT INTO",
        "VALUES",
        "UPDATE",
        "SET",
        "DELETE",
        "CREATE TABLE",
        "DROP TABLE",
        "ALTER TABLE",
        "JOIN",
        "LEFT JOIN",
        "RIGHT JOIN",
        "ON",
        "AS",
        "DISTINCT",
        "LIMIT",
        "OFFSET",
        "AND",
        "OR",
        "IN",
        "NOT",
        "NULL",
      ];

      const getDb = async () => {
        const duckdb = duckdbduckdbWasm;
        if (window._db) return window._db;
        const JSDELIVR_BUNDLES = duckdb.getJsDelivrBundles();
        const bundle = await duckdb.selectBundle(JSDELIVR_BUNDLES);
        const worker_url = URL.createObjectURL(
          new Blob([`importScripts("${bundle.mainWorker}");`], {
            type: "text/javascript",
          })
        );
        const worker = new Worker(worker_url);
        const logger = new duckdb.ConsoleLogger();
        const db = new duckdb.AsyncDuckDB(logger, worker);
        await db.instantiate(bundle.mainModule, bundle.pthreadWorker);
        URL.revokeObjectURL(worker_url);
        window._db = db;
        return db;
      };

      async function updateSchemaCache() {
        currentSchema = { tables: {}, keywords };
        const result = await conn.query("SHOW TABLES;");
        const tables = result.toArray().map((r) => r.name);
        for (const table of tables) {
          const info = await conn.query(`PRAGMA table_info('${table}');`);
          currentSchema.tables[table] = info.toArray().map((f) => f.name);
        }
        monaco.languages.registerCompletionItemProvider("sql", {
          provideCompletionItems: () => {
            const suggestions = keywords.map((k) => ({
              label: k,
              kind: monaco.languages.CompletionItemKind.Keyword,
              insertText: k,
            }));
            for (const table in currentSchema.tables) {
              suggestions.push({
                label: table,
                kind: monaco.languages.CompletionItemKind.Struct,
                insertText: table,
              });
              currentSchema.tables[table].forEach((col) => {
                suggestions.push({
                  label: col,
                  kind: monaco.languages.CompletionItemKind.Field,
                  insertText: col,
                });
              });
            }
            return { suggestions };
          },
        });
      }

      async function refreshTables() {
        const result = await conn.query("SHOW TABLES;");
        const tables = result.toArray().map((r) => r.name);
        tablesList.innerHTML = "";
        await updateSchemaCache();
        for (const table of tables) {
          const li = document.createElement("li");
          li.classList.add("table-item");
          li.textContent = table;

          li.addEventListener("click", async () => {
            const existingDetails = li.querySelector(".schema-details");
            if (existingDetails) {
              existingDetails.style.display =
                existingDetails.style.display === "none" ? "block" : "none";
              return;
            }

            const schema = await conn.query(`PRAGMA table_info('${table}');`);
            const fields = schema.toArray();
            const cols = fields
              .map((f) => `${f.name} (${f.type})`)
              .join("<br>");

            const detailsDiv = document.createElement("div");
            detailsDiv.className = "schema-details";
            detailsDiv.innerHTML = cols;
            li.appendChild(detailsDiv);

            // Add copy-to-clipboard snippet
            const sqlSnippet = `SELECT * FROM ${table} LIMIT 100;`;
            try {
              await navigator.clipboard.writeText(sqlSnippet);
              const copyDiv = document.createElement("div");
              copyDiv.className = "schema-details";
              copyDiv.style.color = "green";
              copyDiv.innerText = "Copied SQL: SELECT * FROM table";
              li.appendChild(copyDiv);
              setTimeout(() => copyDiv.remove(), 1500);
            } catch (err) {
              console.warn("Clipboard write failed:", err);
            }
          });

          tablesList.appendChild(li);
        }
      }

      csvInput.addEventListener("change", async (event) => {
        const files = event.target.files;
        if (!files.length) return;

        const db = await getDb();
        conn = await db.connect();
        output.innerHTML = "";

        for (const file of files) {
          const buffer = await file.arrayBuffer();
          await db.registerFileBuffer(file.name, new Uint8Array(buffer));
          const tableName = file.name
            .replace(/[^a-zA-Z0-9_]/g, "_")
            .replace(/_csv$/, "");
          await conn.query(
            `CREATE OR REPLACE TABLE ${tableName} AS SELECT * FROM read_csv_auto('${file.name}', AUTO_DETECT=TRUE, HEADER=TRUE);`
          );
          output.innerHTML += `<p><strong>Loaded:</strong> ${file.name}</p><p>Table created: <code>${tableName}</code></p>`;
        }

        await updateSchemaCache();
        refreshTables();
      });

      runBtn.addEventListener("click", async () => {
        const query = editor.getValue();
        if (!conn || !query) return;
        try {
          const result = await conn.query(query);
          const data = result.toArray();
          const cols = result.schema.fields.map((f) => f.name);
          renderTableWithTabulator(data, cols);
          appendQueryToNotes(query);
          await updateSchemaCache();
          refreshTables();
        } catch (err) {
          output.innerHTML = `<p style="color:red;">Error: ${err.message}</p>`;
        }
      });

      function appendQueryToNotes(query) {
        let noteContent = notesEditor.getValue();
        noteContent += `\n\n-- Query Executed --\n${query.trim()}\n`;
        notesEditor.setValue(noteContent);
        localStorage.setItem("duckdb_notes", noteContent);
      }

      async function renderTableWithTabulator(rows, columns) {
        const tableData = rows;
        const query = editor.getValue();
        if (!conn || !query) return;
        const result = await conn.query(query);
        const data = result.toArray();
        const tableColumns = result.schema.fields.map((field) => {
          let sorter = "string";
          if (
            [
              "INT32",
              "INT64",
              "INTEGER",
              "BIGINT",
              "SMALLINT",
              "TINYINT",
            ].includes(field.type)
          ) {
            sorter = "number";
          } else if (
            ["DOUBLE", "FLOAT", "REAL", "DECIMAL"].includes(field.type)
          ) {
            sorter = "number";
          } else if (["BOOLEAN"].includes(field.type)) {
            sorter = "boolean";
          }

          return {
            title: field.name,
            field: field.name,
            sorter,
            headerFilter: "input",
          };
        });

        tabulator = new Tabulator("#tabulatorOutput", {
          data: tableData,
          columns: tableColumns,
          layout: "fitColumns",
          pagination: "local",
          paginationSize: 10,
          movableColumns: true,
          resizableRows: true,
          autoColumns: false,
        });

        output.outerHTML = ``;
      }

      function getPaginationControls() {
        const totalPages = Math.ceil(fullData.length / rowsPerPage);
        if (totalPages <= 1) return "";
        return `
          <div style="margin-top:10px;">
            <button onclick="prevPage()" ${
              currentPage === 1 ? "disabled" : ""
            }>Prev</button>
            Page ${currentPage} of ${totalPages}
            <button onclick="nextPage()" ${
              currentPage === totalPages ? "disabled" : ""
            }>Next</button>
          </div>`;
      }

      window.exportCSV = () => {
        if (!tabulator) return;
        tabulator.download("csv", "tabulator_export.csv");
      };

      window.prevPage = () => {
        if (currentPage > 1) {
          currentPage--;
          renderPaginatedTable();
        }
      };

      window.nextPage = () => {
        const totalPages = Math.ceil(fullData.length / rowsPerPage);
        if (currentPage < totalPages) {
          currentPage++;
          renderPaginatedTable();
        }
      };

      require.config({
        paths: {
          vs: "https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs",
        },
      });

      require(["vs/editor/editor.main"], function () {
        editor = monaco.editor.create(document.getElementById("editor"), {
          value: "SELECT * FROM my_table;",
          language: "sql",
          theme: "vs-light",
          automaticLayout: true,
        });

        notesEditor = monaco.editor.create(
          document.getElementById("notesEditor"),
          {
            value:
              localStorage.getItem("duckdb_notes") ||
              "// Write your notes here...",
            language: "plaintext",
            theme: "vs-light",
            automaticLayout: true,
          }
        );

        let notesSaveTimeout;
        notesEditor.onDidChangeModelContent(() => {
          clearTimeout(notesSaveTimeout);
          notesSaveTimeout = setTimeout(() => {
            localStorage.setItem("duckdb_notes", notesEditor.getValue());
          }, 500);
        });

        document
          .getElementById("clearNotesBtn")
          .addEventListener("click", () => {
            if (confirm("Are you sure you want to clear your notes?")) {
              notesEditor.setValue("// Write your notes here...");
              localStorage.removeItem("duckdb_notes");
            }
          });
      });
    </script>
  </body>
</html>
